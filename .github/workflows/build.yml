name: Build and test

on:
  push:
  workflow_dispatch:

jobs:
  # The pure-Kotlin core is a separate job on purpose: it needs no Android SDK,
  # runs in seconds, and covers the code where a bug is silent rather than
  # loud. Keeping it independent means a broken UI never hides a broken
  # classifier, and the fast signal arrives without waiting on an APK.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test core logic
        run: ./gradlew :core:classify:test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/classify/build/reports/tests/test
          if-no-files-found: ignore
