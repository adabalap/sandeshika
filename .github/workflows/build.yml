name: Build and test

on:
  push:
  workflow_dispatch:

jobs:
  # The pure-Kotlin core is a separate job on purpose: it needs no Android SDK,
  # runs in seconds, and covers the code where a bug is silent rather than
  # loud. Keeping it independent means a broken UI never hides a broken
  # classifier, and the fast signal arrives without waiting on an APK.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check XML well-formedness
        run: python3 tools/check_xml.py

      - name: Test core logic
        run: ./gradlew :core:classify:test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/classify/build/reports/tests/test
          if-no-files-found: ignore

  # Separate job from `core` on purpose: the pure-Kotlin tests give fast
  # signal in seconds and must not be gated behind an Android SDK download
  # and a full APK build. A UI mistake should never hide a classifier
  # regression.
  apk:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sandeshika-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sandeshika-apk
          path: dist/*.apk
          if-no-files-found: error
