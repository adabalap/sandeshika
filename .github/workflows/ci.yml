name: CI

# Correctness used to rest on someone remembering to run six test files by
# hand. Nothing merges now without the parser's false-positive count, the
# redactor's leak scan, and a real browser boot all being checked.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  javascript:
    name: JS — lint, types, 12 suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The e2e suite starts app.py itself. Without the Python deps it skips
      # loudly rather than failing; installing them here means it actually runs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python — server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt ruff
      - run: ruff check app.py tools/ tests/server_test.py
      - run: python3 tests/server_test.py

      # A checkout upgraded by extracting an archive keeps every file the new
      # version deleted. Those files still get picked up by the test glob and
      # fail with an error about their contents rather than about no longer
      # belonging.
      - name: No files left over from an earlier release
        run: python3 tools/prune_stale.py

      # The manifest is generated, so a release built without regenerating it
      # would prune files that are meant to be there.
      - name: MANIFEST.txt is current
        run: |
          cp MANIFEST.txt /tmp/manifest.before
          python3 tools/make_manifest.py
          diff -u /tmp/manifest.before MANIFEST.txt || {
            echo "::error::MANIFEST.txt is stale — run: python3 tools/make_manifest.py"
            exit 1; }

      # The redactor exists in two places: redact.py for bulk corpus files and
      # core/redact.js for the in-app share button. Its own self-test runs here
      # so the offline tool cannot rot while the in-app one is maintained.
      - name: Offline redactor self-test
        run: python3 tools/redact.py --selftest

      - name: Server boots and serves the shell
        run: |
          python3 app.py --mock --port 5055 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:5055/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5055/healthz > /dev/null
          curl -fsS http://127.0.0.1:5055/config.json > /dev/null
          curl -fsS http://127.0.0.1:5055/api/health > /dev/null
          curl -fsS http://127.0.0.1:5055/static/js/main.js > /dev/null
          # An open proxy would expose the whole of Medha to any script on the
          # page, so the allowlist is verified against the running server and
          # not only in unit tests.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/api/admin/keys)" = "403"
