[versions]
agp                = "8.7.3"
kotlin             = "2.1.0"
ksp                = "2.1.0-1.0.29"
composeBom         = "2024.12.01"
coreKtx            = "1.15.0"
lifecycle          = "2.8.7"
activityCompose    = "1.9.3"
navigationCompose  = "2.8.5"
adaptiveNav        = "1.3.1"
room               = "2.6.1"
sqlcipher          = "4.6.1"
sqliteKtx          = "2.4.0"
work               = "2.10.0"
datastore          = "1.1.1"
securityCrypto     = "1.1.0-alpha06"
biometric          = "1.2.0-alpha05"
okhttp             = "4.12.0"
serialization      = "1.7.3"
coroutines         = "1.9.0"
junit              = "4.13.2"
androidxTestJunit  = "1.2.1"
robolectric        = "4.14.1"

[libraries]
androidx-core-ktx              = { module = "androidx.core:core-ktx",                         version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose      = { module = "androidx.activity:activity-compose",             version.ref = "activityCompose" }
androidx-navigation-compose    = { module = "androidx.navigation:navigation-compose",         version.ref = "navigationCompose" }
compose-bom                    = { module = "androidx.compose:compose-bom",                   version.ref = "composeBom" }
compose-ui                     = { module = "androidx.compose.ui:ui" }
compose-ui-graphics            = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling             = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview     = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3              = { module = "androidx.compose.material3:material3" }
compose-material-icons         = { module = "androidx.compose.material:material-icons-extended" }
compose-adaptive-navigation    = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "adaptiveNav" }
room-runtime                   = { module = "androidx.room:room-runtime",   version.ref = "room" }
room-ktx                       = { module = "androidx.room:room-ktx",       version.ref = "room" }
room-compiler                  = { module = "androidx.room:room-compiler",  version.ref = "room" }
room-testing                   = { module = "androidx.room:room-testing",   version.ref = "room" }
sqlcipher                      = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
sqlite-ktx                     = { module = "androidx.sqlite:sqlite-ktx",    version.ref = "sqliteKtx" }
work-runtime-ktx               = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
datastore-preferences          = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
security-crypto                = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
biometric                      = { module = "androidx.biometric:biometric",  version.ref = "biometric" }
okhttp                         = { module = "com.squareup.okhttp3:okhttp",   version.ref = "okhttp" }
kotlinx-serialization-json     = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
junit                          = { module = "junit:junit",                   version.ref = "junit" }
androidx-test-junit            = { module = "androidx.test.ext:junit",       version.ref = "androidxTestJunit" }
robolectric                    = { module = "org.robolectric:robolectric",   version.ref = "robolectric" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
