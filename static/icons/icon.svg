<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6246C8"/><stop offset="1" stop-color="#2A1F63"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!--
    An inbox tray with messages being sorted INTO it.
    The tray says "inbox", the two chutes above say "sorted", and the shape is
    distinct at a glance from every chat app on the launcher — which a plain
    speech bubble is not.
  -->
  <g fill="#FFFFFF">
    <rect x="12.5" y="7.5" width="9"  height="4.6" rx="2.3" opacity="0.55"/>
    <rect x="26.5" y="7.5" width="9"  height="4.6" rx="2.3" opacity="0.55"/>
    <rect x="12.5" y="14.6" width="9" height="4.6" rx="2.3" opacity="0.8"/>
    <rect x="26.5" y="14.6" width="9" height="4.6" rx="2.3" opacity="0.8"/>
  </g>
  <!-- tray -->
  <path d="M8,24.5 h32 a2,2 0 0 1 2,2 v10.5 a3.5,3.5 0 0 1 -3.5,3.5 h-29 a3.5,3.5 0 0 1 -3.5,-3.5 v-10.5 a2,2 0 0 1 2,-2 z"
        fill="#FFFFFF"/>
  <!-- the slot, cut dark so the tray reads as a container not a card -->
  <path d="M6,30.5 h9 a1.6,1.6 0 0 1 1.6,1.4 a7.6,7.6 0 0 0 14.8,0 a1.6,1.6 0 0 1 1.6,-1.4 h9"
        fill="none" stroke="#2A1F63" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- one item dropping in, tinted gold: the thing worth noticing -->
  <rect x="20.6" y="19.4" width="6.8" height="6.8" rx="2" fill="#F4A623"/>
</svg>
