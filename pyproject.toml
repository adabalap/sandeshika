# Ruff configuration.
#
# An explicit rule set rather than whatever the installed version defaults to:
# a linter whose rules shift when CI picks up a new release will fail a build
# nobody broke, and the fix will have nothing to do with the change under review.
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes — the ones that are actually bugs
  "W",    # whitespace
  "I",    # import order
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplifications
  "DTZ",  # naive datetimes
]
ignore = [
  # The parser and redactor are built from regex tables where alignment across
  # lines is what makes them reviewable. Reflowing them to satisfy a column
  # limit makes a security-relevant file harder to read, not easier.
  "E501",
  # re.I is the idiom in every regex reference these patterns were written from.
  "SIM905",
  # The mock inbox is generated in local wall-clock time on purpose: a real
  # phone's SMS timestamps are local, and a tz-aware clock here would put demo
  # data in a different day bucket from the one the UI renders.
  "DTZ005",
]

[tool.ruff.lint.per-file-ignores]
# sys.path is set before importing app, which is the point of the import.
"tests/server_test.py" = ["E402"]
# The maintenance scripts are single-purpose CLIs run by hand, not library code.
# A context manager around a read immediately followed by process exit buys
# nothing, and the loop-variable warnings are about readable tuple unpacking.
"tools/bump_version.py" = ["SIM115"]
"tools/corpus.py" = ["SIM115", "B007", "DTZ"]
# The redactor manipulates the local calendar deliberately — shifting dates is
# its privacy mechanism, so timezone-aware datetimes would be wrong here.
"tools/redact.py" = ["SIM115", "DTZ"]
